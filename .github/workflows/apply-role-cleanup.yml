name: Apply role model cleanup

on:
  push:
    branches: [fix/roles-and-junk]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/roles-and-junk
          fetch-depth: 1
      - name: Apply exactly two roles and remove junk
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            perl -0pi -e "s/'client'/'student'/g; s/\"client\"/\"student\"/g; s/'psychologist'/'admin'/g; s/\"psychologist\"/\"admin\"/g" "$file"
          done < <(find . -type f \( -name '*.php' -o -name '*.sql' -o -name '*.md' \) -not -path './.git/*' -print0)

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Controllers/AuthController.php')
          s = p.read_text()
          s = s.replace("            'admin' => '/admin',\n            'admin' => '/dashboard',\n", "            'admin' => '/admin',\n")
          p.write_text(s)
          PY

          rm -rf .DS_Store .idea output.txt NMSTUsite.zip

          printf '\n# IDE / local / generated files\n.DS_Store\n.idea/\nNMSTUsite.zip\n' >> .gitignore

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: reduce roles to student and admin and remove junk'
          git push origin fix/roles-and-junk
